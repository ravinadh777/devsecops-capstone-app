# sonar.projectKey is overridden by the SONAR_PROJECT_KEY repository variable in CI.
sonar.projectKey=ravinadh777_devsecops-capstone-app
sonar.projectName=Student Task Manager
sonar.sources=src,public
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=public/**
# Fail the CI job when the quality gate fails (do not just report it).
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
